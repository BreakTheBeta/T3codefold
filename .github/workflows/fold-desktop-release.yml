name: Fold desktop release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Fold release version (Linux and Android)
        required: true
        default: 0.4.11
      release_tag:
        description: Optional release tag (defaults to fold-preview-vVERSION)
        required: false
        default: ""

      platform:
        description: Installer platform to publish
        type: choice
        options: [all, mac, linux, win]
        default: linux
      desktop_only:
        description: Rebuild desktop installers using an already published server version
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  unix:
    if: github.repository == 'BreakTheBeta/T3codefold'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platform == 'mac' && '[{"runner":"macos-26-intel","platform":"mac","target":"dmg","arch":"universal"}]' || inputs.platform == 'linux' && '[{"runner":"ubuntu-24.04","platform":"linux","target":"AppImage","arch":"x64"}]' || '[{"runner":"macos-26-intel","platform":"mac","target":"dmg","arch":"universal"},{"runner":"ubuntu-24.04","platform":"linux","target":"AppImage","arch":"x64"}]') }}
    concurrency:
      group: fold-desktop-${{ matrix.platform }}
      cancel-in-progress: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: c1c950440ee06ad9878f3e86eadf24f8a214b55c
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          run-install: true
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup override set 1.95.0
      - name: Install Linux build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config imagemagick
      - name: Install macOS Rust targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build desktop artifacts
        id: build
        shell: bash
        env:
          FOLD_VERSION: ${{ inputs.version }}
          BUILD_PLATFORM: ${{ matrix.platform }}
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_ARCH: ${{ matrix.arch }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          args=(--platform "$BUILD_PLATFORM" --target "$BUILD_TARGET" --arch "$BUILD_ARCH" --build-version "$FOLD_VERSION" --output-dir release-assets --verbose)
          publish_mode=""
          if [[ "$BUILD_PLATFORM" == mac ]]; then
            if [[ -n "$CSC_LINK" && -n "$CSC_KEY_PASSWORD" && -n "$APPLE_API_KEY" && -n "$APPLE_API_KEY_ID" && -n "$APPLE_API_ISSUER" && -n "$APPLE_TEAM_ID" && -n "$MACOS_PROVISIONING_PROFILE" ]]; then
              key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
              printf '%s' "$APPLE_API_KEY" > "$key_path"
              export APPLE_API_KEY="$key_path"
              profile_path="$RUNNER_TEMP/fold.provisionprofile"
              printf '%s' "$MACOS_PROVISIONING_PROFILE" | base64 -D > "$profile_path"
              security cms -D -i "$profile_path" >/dev/null
              export T3CODE_APPLE_TEAM_ID="$APPLE_TEAM_ID"
              export T3CODE_MACOS_PROVISIONING_PROFILE="$profile_path"
              args+=(--signed)
            else
              publish_mode="--manual-only"
              echo "Apple signing is not configured; publishing a manual download only."
            fi
          fi
          GITHUB_SHA="$(git rev-parse HEAD)" node scripts/build-desktop-artifact.ts "${args[@]}"
          echo "publish_mode=$publish_mode" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: fold-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error
      - name: Publish Fold desktop feed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          FOLD_VERSION: ${{ inputs.version }}
          PUBLISH_MODE: ${{ steps.build.outputs.publish_mode }}
        run: GITHUB_SHA="$(git rev-parse HEAD)" node scripts/publish-fold-desktop.ts release-assets "$RELEASE_TAG" "$FOLD_VERSION" "$PUBLISH_MODE"
