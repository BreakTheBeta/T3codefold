name: Fold desktop release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Desktop version
        required: true
        default: 0.1.6
      release_tag:
        description: Existing Fold release to attach the installer to
        required: true
        default: fold-preview-v0.1.6

permissions:
  contents: read

concurrency:
  group: fold-desktop-release
  cancel-in-progress: false

jobs:
  server:
    if: github.repository == 'BreakTheBeta/T3codefold'
    uses: ./.github/workflows/fold-server-release.yml
    permissions:
      contents: write
    with:
      version: ${{ inputs.version }}
      channel: ${{ contains(inputs.version, '-nightly.') && 'nightly' || 'latest' }}
  unix:
    needs: server
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: mac
            target: dmg
            arch: universal
          - runner: ubuntu-24.04
            platform: linux
            target: AppImage
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          run-install: true
      - name: Build desktop artifacts
        env:
          FOLD_VERSION: ${{ inputs.version }}
          BUILD_PLATFORM: ${{ matrix.platform }}
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_ARCH: ${{ matrix.arch }}
        run: node scripts/build-desktop-artifact.ts --platform "$BUILD_PLATFORM" --target "$BUILD_TARGET" --arch "$BUILD_ARCH" --build-version "$FOLD_VERSION" --output-dir release-assets --verbose
      - uses: actions/upload-artifact@v7
        with:
          name: fold-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error
      - name: Publish Fold desktop feed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          FOLD_VERSION: ${{ inputs.version }}
        run: node scripts/publish-fold-desktop.ts release-assets "$RELEASE_TAG" "$FOLD_VERSION"
  wsl:
    if: github.repository == 'BreakTheBeta/T3codefold'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          run-install: true
      - name: Build WSL terminal binding
        shell: bash
        run: |
          pty_pkg="$(node -e "console.log(require.resolve('node-pty/package.json', { paths: ['./apps/server'] }))")"
          pty_dir="$(dirname "$pty_pkg")"
          (cd "$pty_dir" && npx --yes node-gyp rebuild)
          mkdir -p wsl-prebuild
          cp "$pty_dir/build/Release/pty.node" wsl-prebuild/pty.node
      - uses: actions/upload-artifact@v7
        with:
          name: fold-wsl-pty
          path: wsl-prebuild/pty.node
  windows:
    needs: [wsl, server]
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          run-install: true
      - name: Install Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup override set 1.95.0
      - uses: actions/download-artifact@v8
        with:
          name: fold-wsl-pty
          path: wsl-prebuild
      - name: Install Spectre-mitigated MSVC libs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) {
            $code = if ($null -ne $proc) { $proc.ExitCode } else { 1 }
            Write-Error "Visual Studio Installer failed with exit code $code"
            exit $code
          }

      - name: Build Windows installer
        shell: pwsh
        env:
          FOLD_VERSION: ${{ inputs.version }}
        run: |
          node scripts/build-desktop-artifact.ts --platform win --target nsis --arch x64 --build-version "$env:FOLD_VERSION" --output-dir release-assets --wsl-prebuild wsl-prebuild/pty.node --verbose
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: fold-windows-x64
          path: release-assets/*
          if-no-files-found: error
      - name: Publish Fold desktop feed
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          FOLD_VERSION: ${{ inputs.version }}
        run: |
          node scripts/publish-fold-desktop.ts release-assets "$env:RELEASE_TAG" "$env:FOLD_VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
