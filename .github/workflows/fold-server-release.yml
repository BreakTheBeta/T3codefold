name: Fold server release
on:
  workflow_call:
    inputs:
      channel:
        type: string
        default: latest
      version:
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      version:
        description: Exact Fold version (defaults to the version on this commit)
        type: string
        default: ""
      channel:
        description: Fold update channel
        type: choice
        options: [latest, nightly]
        default: latest
permissions:
  contents: write
concurrency:
  group: fold-server-release-arm-capacity
  cancel-in-progress: false
jobs:
  archives:
    if: github.repository == 'BreakTheBeta/T3codefold'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, platform: linux, arch: x64, key: linux-x64 }
          - { runner: ubuntu-24.04-arm, platform: linux, arch: arm64, key: linux-arm64 }
          - { runner: macos-15, platform: mac, arch: arm64, key: darwin-arm64 }
          - { runner: windows-2025, platform: win, arch: x64, key: win32-x64 }
          - { runner: windows-11-arm, platform: win, arch: arm64, key: win32-arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 7cacec4879d6cc4e56cfc46dd6503a14fc214f66
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          run-install: true
      - name: Align release versions
        if: inputs.version != ''
        env:
          FOLD_VERSION: ${{ inputs.version }}
        run: node scripts/update-release-package-versions.ts "$FOLD_VERSION"
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Build web and server bundle
        run: vp run --filter t3 build
      - name: Install executable build runtime
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - name: Build executable
        run: |
          # vp pack can launch its own runtime; keep it on the repository's SEA version.
          export VP_NODE_VERSION="$(node -p 'require("./package.json").engines.node')"
          node apps/server/scripts/cli.ts build-exe --verbose
      - name: Build and stage resource monitor
        run: |
          cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml
          key="$(node -p 'process.platform + "-" + process.arch')"
          binary="t3-resource-monitor${{ matrix.platform == 'win' && '.exe' || '' }}"
          mkdir -p "cli-resource-monitor/$key"
          cp "native/resource-monitor/target/release/$binary" "cli-resource-monitor/$key/$binary"
      - name: Package CLI archive
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          version="$(node -p "require('./apps/server/package.json').version")"
          node scripts/build-cli-archive.ts --platform "$BUILD_PLATFORM" --arch "$BUILD_ARCH" --version "$version" --resource-monitor-dir cli-resource-monitor --output-dir release-cli
      - name: Smoke-test extracted executable
        run: |
          version="$(node -p "require('./apps/server/package.json').version")"
          for archive in release-cli/*; do
            node scripts/smoke-cli-archive.ts --archive "$archive" --expect-version "$version"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: fold-cli-${{ matrix.key }}
          path: release-cli/*
          if-no-files-found: error
  release:
    needs: archives
    if: github.repository == 'BreakTheBeta/T3codefold'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 7cacec4879d6cc4e56cfc46dd6503a14fc214f66
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          run-install: true
      - name: Align versions for a desktop release
        if: inputs.version != ''
        env:
          FOLD_VERSION: ${{ inputs.version }}
        run: node scripts/update-release-package-versions.ts "$FOLD_VERSION"
      - name: Build server and web client
        run: vp run --filter t3 build
      - name: Package Fold runtime
        run: node scripts/pack-fold-server.ts release-assets
      - name: Verify install outside the workspace
        shell: bash
        run: |
          set -euo pipefail
          runtime_dir="$(mktemp -d)"
          npm install --prefix "$runtime_dir" --no-audit --no-fund "$PWD"/release-assets/t3-*.tgz
          "$runtime_dir/node_modules/.bin/t3" --version
          "$runtime_dir/node_modules/.bin/t3" __service-preflight --database-path "$runtime_dir/preflight.sqlite" --launcher-protocol 3
      - uses: actions/download-artifact@v8
        with:
          pattern: fold-cli-*
          path: release-assets
          merge-multiple: true
      - name: Checksum executable archives
        run: cd release-assets && sha256sum *.tar.gz *.zip > SHA256SUMS
      - name: Publish immutable version and update channel
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
        shell: bash
        run: |
          set -euo pipefail
          export GITHUB_SHA="$(git rev-parse HEAD)"
          version="$(node -p "require('./apps/server/package.json').version")"
          tag="fold-server-v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            published_commit="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)"
            test "$published_commit" = "$GITHUB_SHA" || { echo "Version already belongs to another commit" >&2; exit 1; }
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir published
            (cd published && sha256sum -c SHA256SUMS)
            cp "published/t3-$version.tgz" "release-assets/t3-$version.tgz"
          else
          gh release create "$tag" release-assets/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Fold server $version" --notes "Fold server and web client. Install a self-contained CLI archive, or use the npm-compatible tarball for older launchers." --prerelease
          fi
          cp "release-assets/t3-$version.tgz" release-assets/t3.tgz
          channel_tag="fold-server-$CHANNEL"
          if ! gh release view "$channel_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$channel_tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Fold server $CHANNEL" --notes "Rolling Fold server package. Exact versions are published separately." --prerelease
          fi
          gh release upload "$channel_tag" release-assets/t3.tgz --repo "$GITHUB_REPOSITORY" --clobber
