name: Pitboss gates
on:
  pull_request:
    paths:
      - "apps/server/src/pitboss/**"
      - "apps/server/src/cli/work*"
      - "apps/server/src/orchestration-v2/**"
      - "apps/server/src/mcp/**"
      - "apps/web/src/components/pitboss/**"
      - "apps/mobile/src/features/threads/PitbossWork.tsx"
      - "packages/contracts/src/pitboss*"
      - "scripts/pitboss-tracker-fixture.ts"
      - ".github/workflows/pitboss-gates.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local:
    name: Gate A — task and context protocol
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - run: vp run test:pitboss:local
  coordination:
    name: Gate B — peers and live tracker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      tracker:
        image: vikunja/vikunja:2.3.0
        ports:
          - 3456/tcp
        env:
          VIKUNJA_SERVICE_PUBLICURL: http://localhost:3456
          VIKUNJA_FILES_BASEPATH: /tmp/files
          VIKUNJA_DATABASE_TYPE: sqlite
          VIKUNJA_DATABASE_PATH: /tmp/pitboss.db
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - name: Create isolated tracker fixture
        env:
          T3_PITBOSS_TRACKER_URL: http://127.0.0.1:${{ job.services.tracker.ports[3456] }}
        run: |
          fixture=$(node scripts/pitboss-tracker-fixture.ts)
          echo "T3_PITBOSS_TRACKER_FIXTURE=$fixture" >> "$GITHUB_ENV"
      - run: vp run test:pitboss:coordination
      - name: Remove fixture credentials
        if: always()
        run: |
          if [ -n "${T3_PITBOSS_TRACKER_FIXTURE:-}" ]; then rm -f -- "$T3_PITBOSS_TRACKER_FIXTURE"; fi
